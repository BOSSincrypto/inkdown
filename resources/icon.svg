<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a6cf7"/>
      <stop offset="100%" style="stop-color:#6c3af7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <!-- Pen nib -->
    <path d="M-20,-160 L20,-160 L35,-40 L0,80 L-35,-40 Z" fill="white" opacity="0.95"/>
    <!-- Pen tip -->
    <path d="M-10,80 L0,140 L10,80 Z" fill="white" opacity="0.9"/>
    <!-- Pen slit -->
    <line x1="0" y1="-40" x2="0" y2="80" stroke="url(#bg)" stroke-width="3"/>
    <!-- Ink drop -->
    <circle cx="60" cy="100" r="22" fill="white" opacity="0.7"/>
    <circle cx="85" cy="130" r="12" fill="white" opacity="0.5"/>
    <!-- Down arrow (markdown) -->
    <path d="M-90,40 L-90,-20 L-120,10 L-70,-50 L-20,10 L-50,-20 L-50,40 Z" fill="white" opacity="0.6" transform="translate(-30,60) scale(0.7)"/>
  </g>
</svg>
